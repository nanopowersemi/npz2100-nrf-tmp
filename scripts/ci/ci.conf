# Kconfig added to every sample built for the bench tests (scripts/ci/build.py
# and run_samples.py), on top of its prj.conf. Twister builds do not use it.

# Send each log message out of the UART as it is logged, instead of from
# the log thread later, so the log lines land in order with the I2C
# transactions the AD3 sniffs (run_samples.py --i2c). Each line holds up
# the caller for its transmit time (~7 ms for 80 characters at 115200).
CONFIG_LOG_MODE_IMMEDIATE=y
