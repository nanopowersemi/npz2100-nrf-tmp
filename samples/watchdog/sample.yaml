sample:
  name: nPZ2100 watchdog
  description: nPZ2100 watchdog resetting a hung host, with a 3 s time-out wake
common:
  tags: npz2100
  # Boards the npz2100 shield has board overlays for.
  platform_allow:
    - nrf52dk/nrf52832
    - nrf52833dk/nrf52833
    - nrf52840dk/nrf52840
  integration_platforms:
    - nrf52833dk/nrf52833
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "nPZ2100 watchdog sample boot"
      - "Simulating a hang"
      - "Recovered from a watchdog reset"
tests:
  sample.npz2100.watchdog: {}
