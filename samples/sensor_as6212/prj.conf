# samples/sensor_as6212/prj.conf
# ------------------------------
# Kconfig for the nPZ2100 DK AS6212 sample / NCS 3.3.4.
#
# The npz2100dk board defines the nPZ2100 devicetree node on i2c0, and the
# npz2100 shield (selected in CMakeLists.txt) adds it on other boards.
# The nPZ2100 controls the nRF52833 power supply directly via SW_HP, so
# every boot is caused by the nPZ2100 re-enabling the host switch.

# nPZ2100 driver
CONFIG_NPZ2100=y
CONFIG_NPZ2100_INIT_PRIORITY=80

# Status LED
CONFIG_GPIO=y

# Driver logging (0=OFF 1=ERR 2=WRN 3=INF 4=DBG)
CONFIG_LOG=y
CONFIG_NPZ2100_LOG_LEVEL_INF=y

# Colored log: errors red, warnings yellow, and the key events colored by
# main.c (samples/common/sample_log_color.h). Set to n for plain output.
CONFIG_LOG_BACKEND_SHOW_COLOR=y

# Console on the DK's USB-UART (FT231X), as set by the board.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Register dump, for bench work: set APP_DUMP_REGISTERS in src/main.c too.
# CONFIG_NPZ2100_DUMP=y
