# samples/sensor_as6212/sysbuild-mcuboot.conf
# -------------------------------------------
# Optional sysbuild configuration: builds MCUboot together with the
# application. Select it with
#   west build -b npz2100dk/nrf52833 samples/sensor_as6212/ \
#       -- -DSB_CONF_FILE=sysbuild-mcuboot.conf
# Without it, the sample builds without a bootloader. MCUboot's own
# settings are in sysbuild/mcuboot.conf, which sysbuild only uses when
# MCUboot is built.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Single application slot: serial recovery writes the new image straight
# into the primary slot, which leaves the most flash for the application.
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y

# Images are signed with MCUboot's public development key, which NCS uses
# when no key file is given (the build prints a warning saying so). That
# key is public: anyone can sign an image for a board running this MCUboot.
# For a product, generate your own key and point to it:
#   SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
#   SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APP_DIR}/keys/<your-key>.pem"
