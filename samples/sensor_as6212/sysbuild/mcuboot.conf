# samples/sensor_as6212/sysbuild/mcuboot.conf
# -------------------------------------------
# MCUboot settings, used only when the sample is built with
# sysbuild-mcuboot.conf.
#
# Serial recovery over UART0, the DK's USB-UART (FT231X). The DK has no
# spare button for MCUboot to check (SW1 is nRESET), so MCUboot waits a
# short time for an SMP command on every boot instead. Every wake of the
# nPZ2100 is a boot, so this wait costs energy on every wake: keep it short,
# or leave MCUboot out of low-power builds.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=500

# UART0 is taken by serial recovery, so no console in MCUboot.
CONFIG_UART_CONSOLE=n
