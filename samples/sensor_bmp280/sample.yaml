sample:
  name: nPZ2100 BMP280 sensor sample
  description: BMP280 pressure polled every 2 s, threshold wake-up and 10 s time-out
common:
  tags: npz2100
  # Boards the npz2100 shield has board overlays for.
  platform_allow:
    - nrf52dk/nrf52832
    - nrf52833dk/nrf52833
    - nrf52840dk/nrf52840
  integration_platforms:
    - nrf52833dk/nrf52833
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "nPZ2100 BMP280 sample boot"
      - "Start-up - thresholds set out of range"
      - "Global time-out wake"
      - "Pressure: [0-9]+[.][0-9]{2} hPa"
      - "Thresholds set to 300-1100 hPa window"
      - "Peripheral 1 wake"
tests:
  sample.npz2100.sensor_bmp280: {}
