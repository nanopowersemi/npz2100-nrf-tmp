sample:
  name: nPZ2100 global counter alarm
  description: Global time counter, one-shot alarm and 5 s periodic wake
common:
  tags: npz2100
  # Boards the npz2100 shield has board overlays for.
  platform_allow:
    - nrf52dk/nrf52832
    - nrf52833dk/nrf52833
    - nrf52840dk/nrf52840
  integration_platforms:
    - nrf52833dk/nrf52833
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "nPZ2100 global counter alarm sample boot"
      - "Counter: [0-9]+[.][0-9]{3} s"
      - "Returning to idle"
tests:
  sample.npz2100.global_counter_alarm: {}
