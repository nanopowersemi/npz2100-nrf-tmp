# samples/sensor_bme280/prj.conf
# ------------------------------
# Kconfig for the nPZ2100 BME280 sample on nRF5x / NCS 3.3.4.
#
# The npz2100 shield (selected in CMakeLists.txt) adds the nPZ2100
# devicetree node and enables the I²C subsystem by default. The BME280 is
# on the same bus and is accessed with raw I²C transfers, so no Zephyr
# sensor driver is needed.
#
# No GPIO or interrupt configuration is required.
# The nPZ2100 controls the nRF5x power supply directly via SW_HP.
# Every nRF5x boot is caused by the nPZ2100 re-enabling the host switch.

# nPZ2100 driver
CONFIG_NPZ2100=y
CONFIG_NPZ2100_INIT_PRIORITY=80

# Driver logging (0=OFF 1=ERR 2=WRN 3=INF 4=DBG)
CONFIG_LOG=y
CONFIG_NPZ2100_LOG_LEVEL_INF=y

# Colored log: errors red, warnings yellow, and the key events colored by
# main.c (samples/common/sample_log_color.h). Set to n for plain output.
CONFIG_LOG_BACKEND_SHOW_COLOR=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
