sample:
  name: nPZ2100 BME280 sensor sample
  description: BME280 polled every 2 s, threshold wake-up and 10 s time-out
common:
  tags: npz2100
  # Boards the npz2100 shield has board overlays for.
  platform_allow:
    - nrf52dk/nrf52832
    - nrf52833dk/nrf52833
    - nrf52840dk/nrf52840
  integration_platforms:
    - nrf52833dk/nrf52833
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "nPZ2100 BME280 sample boot"
      - "Start-up - thresholds set out of range"
      - "Global time-out wake"
      - "Temperature: -?[0-9]+[.][0-9]{2} C"
      - "Thresholds set to 0-40 C window"
      - "Peripheral 1 wake"
tests:
  sample.npz2100.sensor_bme280: {}
  # Same sample with the driver register shadow on: every boot reads back
  # all nPZ2100 registers and writes only the ones that differ from the
  # device. run_samples.py runs it on the bench as sensor_bme280.shadow.
  sample.npz2100.sensor_bme280.shadow:
    extra_configs:
      - CONFIG_NPZ2100_SHADOW=y
